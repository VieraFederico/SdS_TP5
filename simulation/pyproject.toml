[project]
name = "sds-simulation"
version = "0.1.0"
description = "Orquesta el motor Java, analiza sus salidas y genera figuras y animaciones."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "plotly==7.0.0",
    "questionary==2.1.1",
]

[project.scripts]
simulation = "simulation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: compiles and runs the real Java engine (requires a JDK)",
]
